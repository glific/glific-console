<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glific Console</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash. Mirrors src/lib/theme.tsx.
      (() => {
        try {
          const saved = localStorage.getItem("glific-console:theme");
          const systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
          if (saved === "dark" || ((saved === null || saved === "system") && systemDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
