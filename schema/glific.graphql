  "Revert a WhatsApp form to a specific revision"
  revertToWhatsappFormRevision(whatsappFormId: ID!, revisionId: ID!): WhatsappFormRevisionResult

  "Create Golden QA"
  createGoldenQa(input: GoldenQaInput!): GoldenQaResult

  "Create AI Evaluation"
  createEvaluation(input: EvaluationInput!): EvaluationResult

  "Request a v2 (native-judge) prompt improvement for a completed evaluation"
  improveEvaluationPrompt(evaluationId: ID!): ImprovePromptResult

  askGlific(input: AskGlificInput!): AskGlificResult

  askGlificFeedback(input: AskGlificFeedbackInput!): AskGlificFeedbackResult

  "Initiate async generation of a WhatsApp chatbot system prompt via Kaapi"
  generatePrompt(input: PromptGeneratorInput!): PromptGenerationResult

  """
  Send a chat message to the selected (default: live) config version of an assistant
      via Kaapi. Returns a job_id immediately; the reply is delivered over the
      assistant_chat_response subscription.
