  "Get a list of all interactive templates filtered by various criteria"
  interactiveTemplates(filter: InteractiveTemplateFilter, opts: Opts): [InteractiveTemplate]

  "Get a count of all interactives filtered by various criteria"
  countInteractiveTemplates(filter: InteractiveTemplateFilter): Int

  "get the details of one flow label"
  flowLabel(id: ID!): FlowLabelResult

  "Get a list of all flow labels"
  flowLabels(filter: FlowLabelFilter, opts: Opts): [FlowLabel]

  "Get a count of all flow labels filtered by various criteria"
  countFlowLabels(filter: FlowLabelFilter): Int

  "get the details of one role"
  accessRole(id: ID!): AccessRoleResult

  "Get a list of all roles filtered by various criteria"
  accessRoles(filter: AccessRoleFilter, opts: Opts): [AccessRole]

  "Get a count of all access_roles filtered by various criteria"
  countAccessRoles(filter: AccessRoleFilter): Int

  "Get a list of all contact groups filtered by various criteria"
  contactGroups(filter: ContactGroupFilter, opts: Opts): [ContactGroup]

  "Get a count of all contact groups filtered by various criteria"
  countContactGroups(filter: ContactGroupFilter): Int

