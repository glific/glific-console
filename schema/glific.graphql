  "Get a list of all users filtered by various criteria"
  users(filter: UserFilter, opts: Opts): [User]

  "Get a count of all users filtered by various criteria"
  countUsers(filter: UserFilter): Int

  "Get the details of current user"
  currentUser: UserResult

  "Get the count of sessions for a user"
  fetchUserSessions(id: ID!): Int

  "get the details of one group"
  group(id: ID!): GroupResult

