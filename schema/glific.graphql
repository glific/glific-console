  credential(shortcode: String!): CredentialResult

  "get the details of one provider"
  provider(id: ID!): ProviderResult

  "getting bsp balance"
  bspbalance: Json

  "Get a list of all providers filtered by various criteria"
  providers(filter: ProviderFilter, opts: Opts): [Provider]

  "Get a count of all providers filtered by various criteria"
  countProviders(filter: ProviderFilter): Int

  "Get quality rating details"
  qualityRating: QualityRatingResult

  whatsappHsmCategories: [String]

  "get the details of one session_template"
  sessionTemplate(id: ID!): SessionTemplateResult

  "Get a list of all session_templates filtered by various criteria"
  sessionTemplates(filter: SessionTemplateFilter, opts: Opts): [SessionTemplate]

  "Get a count of all session_templates filtered by various criteria"
  countSessionTemplates(filter: SessionTemplateFilter): Int

