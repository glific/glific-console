  savedSearch(id: ID!): SavedSearchResult

  "Get a list of all searches"
  savedSearches(filter: SavedSearchFilter, opts: Opts): [SavedSearch]

  "Get a count of all searches"
  countSavedSearches(filter: SavedSearchFilter): Int

  "Get a collection count for organization"
  collectionStats(organizationId: ID!): Json

  savedSearchCount(id: ID!, term: String): Int

  "get the details of one flow"
  flow(id: ID!): FlowResult

  "Get a list of all flows"
  flows(filter: FlowFilter, opts: Opts): [Flow]

  "Get a count of all flows filtered by various criteria"
  countFlows(filter: FlowFilter): Int

  "Export flow details so that we can import it again"
  exportFlow(id: ID!): ExportFlow

  "Export flow localization so users can check and translate offline"
  exportFlowLocalization(id: ID!, addTranslation: Boolean): ExportFlowLocalization

  "Get a flow for this user"
  flowGet(id: ID!, isForced: Boolean): FlowResult

  "Release a flow for this user"
  flowRelease: Flow

  "Get broadcast flow stats"
  broadcastStats(messageBroadcastId: ID!): Json

  trigger(id: ID!): TriggerResult

  triggers(filter: TriggerFilter, opts: Opts): [Trigger]

  countTriggers(filter: TriggerFilter): Int

  "Get a list of all webhook_logs filtered by various criteria"
  webhookLogs(filter: WebhookLogFilter, opts: Opts): [WebhookLog]

  "Get a count of all webhook_logs filtered by various criteria"
  countWebhookLogs(filter: WebhookLogFilter): Int

  "Get a list of all notifications filtered by various criteria"
  notifications(filter: NotificationFilter, opts: Opts): [Notification]

  "Get a count of all notifications filtered by various criteria"
  countNotifications(filter: NotificationFilter): Int

  "get the details of one location"
  location(id: ID!): LocationResult

  "Get a list of all location"
  locations(opts: Opts): [Locations]

  "get the details of one billing"
  billing(id: ID!): BillingResult

  "get customer portal link"
  customerPortal: CustomerPortalResult

  "get the details of active billing of organization"
