  "Get a list of all consulting hours filtered by various criteria"
  consultingHours(filter: ConsultingHourFilter, opts: Opts): [ConsultingHour]

  "Get a count of all consulting hours filtered by various criteria"
  countConsultingHours(filter: ConsultingHourFilter): Int

  "Fetches consulting hours between start_date and end_date"
  fetchConsultingHours(filter: FetchConsultingHours): String

  "get the details of one contacs field"
  contactsField(id: ID!): ContactsFieldResult

  "Get a list of all contacts fields filtered by various criteria"
  contactsFields(filter: ContactsFieldFilter, opts: Opts): [ContactsField]

  "Get a count of all contacts fields filtered by various criteria"
  countContactsFields(filter: ContactsFieldFilter): Int

  "get the details of one extension"
  extension(id: ID!): ExtensionResult

  "get the details of active extension of organization"
