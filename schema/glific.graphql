  listContactWaGroup(filter: ContactWaGroupFilter, opts: Opts): [ContactWaGroup]

  "Get a count of all the contacts associated with the wa group"
  countContactWaGroup(filter: ContactWaGroupFilter): Int

  sheet(id: ID!): SheetResult

  sheets(filter: SheetFilter, opts: Opts): [Sheet]

  countSheets(filter: SheetFilter): Int

  "get the details of one ticket"
  ticket(id: ID!): TicketResult

  "Get a list of all tickets"
  tickets(filter: TicketFilter, opts: Opts): [Ticket]

  "Get a count of all tickets filtered by various criteria"
  countTickets(filter: TicketFilter): Int

  "Fetches support tickets between start_date and end_date"
  fetchSupportTickets(filter: FetchSupportTickets): String

  "Get a list of all wa_managed_phones filtered by various criteria"
  waManagedPhones(filter: WaManagedPhoneFilter, opts: Opts): [WaManagedPhone]

  "Get a count of all wa_managed_phones filtered by various criteria"
  countWaManagedPhones(filter: WaManagedPhoneFilter): Int

  "Fetch the QR \/ login screen for a managed phone so an admin can reconnect it"
  whatsappPhoneScreen(waManagedPhoneId: ID!): WaPhoneScreenResult

  "Search for whatsapp group conversations"
  waSearch(waMessageOpts: Opts!, waGroupOpts: Opts!, filter: WaSearchFilter): [WaConversation]

  "New Search for wa_messages + wa_groups"
  waSearchMulti(waMessageOpts: Opts!, waGroupOpts: Opts!, filter: WaSearchFilter): WaSearchCup

  "get the details of one wa group"
  waGroup(id: ID!): WaGroupResult

  "Get a list of all wa groups filtered by various criteria"
  waGroups(filter: WaGroupFilter, opts: Opts): [WaGroup]

  waGroupsCount(filter: WaGroupFilter): Int

  "Fetch the skipped-groups CSV for a completed collection primary-phone job. Admin-only."
  waGroupCollectionPrimaryReport(userJobId: ID!): WaGroupCollectionReport

  "Get Assistant"
  assistant(id: ID!): AssistantResult

  "List Assistants"
  assistants(filter: AssistantFilter, opts: Opts): [Assistant]

  "List Assistant Config Versions"
  assistantConfigVersions: [AssistantConfigVersionForEvals]

  "Get a count of all assistants filtered by various criteria"
  countAssistants(filter: AssistantFilter): Int

  "List all config versions for an assistant"
  assistantVersions(assistantId: ID!): [AssistantConfigVersion]

  "Get a knowledge base file's metadata and signed download URL"
  getFile(fileId: String!): FileResult

  "get the details of one whatsapp poll"
  waPoll(id: ID!): WaPollResult

  "Get a list of all wa polls filtered by various criteria"
  waPolls(filter: WaPollFilter, opts: Opts): [WaPoll]

  "Get a count of all wa polls filtered by various criteria"
  countWaPolls(filter: WaPollFilter): Int

