  deleteUser(id: ID!): UserResult

  updateUser(id: ID!, input: UserInput!): UserResult

  createGroup(input: GroupInput!): GroupResult

  updateGroup(id: ID!, input: GroupInput): GroupResult

  deleteGroup(id: ID!): GroupResult

  createContactGroup(input: ContactGroupInput!): ContactGroupResult

  updateGroupContacts(input: GroupContactsInput!): GroupContacts

  updateContactGroups(input: ContactGroupsInput!): ContactGroups

