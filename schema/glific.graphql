  countWhatsappForms(filter: WhatsappFormFilter): Int

  "Get a list of all whatsapp forms filtered by various criteria"
  listWhatsappForms(filter: WhatsappFormFilter): [WhatsappForm]

  "Get a specific WhatsApp form revision by ID"
  whatsappFormRevision(id: ID!): WhatsappFormRevisionResult

  "List revisions for a WhatsApp form (last 10 by default)"
  listWhatsappFormRevisions(whatsappFormId: ID!, limit: Int): [WhatsappFormRevision]

  "List AI Evaluations"
  aiEvaluations(filter: AiEvaluationFilter, opts: Opts): [AiEvaluation]

  "Count AI Evaluations"
  countAiEvaluations(filter: AiEvaluationFilter): Int

  "List Golden QAs"
  goldenQas(filter: GoldenQaFilter, opts: Opts): [GoldenQa]

